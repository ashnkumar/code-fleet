[project]
name = "linkstash"
version = "0.1.0"
description = "A deliberately small URL shortener — the demo fleet's target codebase."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkstash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
