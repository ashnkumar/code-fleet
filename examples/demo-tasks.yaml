# The task graph `codefleet demo` runs against examples/demo-repo.
#
# It is shaped to exercise the two behaviours that are hard to see in a
# screenshot and easy to fake in a README:
#
#   dependency cascade  T1 -> T2 and T3 -> T5. T2 and T5 are unblocked by the
#                       server the moment their dependency completes, and
#                       picked up on the next tick without anyone asking.
#
#   write veto          T3 and T4 declare disjoint file scopes, so the
#                       scheduler runs them at the same time. But T4 cannot
#                       finish without registering its middleware in api.py,
#                       which T3 is holding. The second writer is denied at the
#                       tool call, backs off, and is retried once T3 releases
#                       the file. That is the realistic failure mode: declared
#                       scope is a guess, and agents follow the code.

tasks:
  - id: T1
    title: "Replace config constants with a Settings dataclass"
    description: |
      In linkstash/config.py, replace the module-level constants with a frozen
      dataclass named Settings holding the same four fields (base_url,
      max_url_length, code_offset, rate_limit_per_minute), plus a module-level
      `settings` instance built from the current default values.

      Keep the old uppercase names as module-level aliases pointing at the
      corresponding attributes of `settings`, so existing imports keep working.
      Do not modify any other file.
    priority: 5
    file_scope: ["linkstash/config.py"]
    depends_on: []

  - id: T2
    title: "Load settings from environment variables"
    description: |
      In linkstash/config.py, add a `load_settings()` function that builds a
      Settings instance from environment variables, falling back to the current
      defaults when a variable is unset. Use the prefix LINKSTASH_ and the
      uppercased field name, e.g. LINKSTASH_BASE_URL, LINKSTASH_MAX_URL_LENGTH.
      Integer fields must be parsed as integers.

      Rebind the module-level `settings` to `load_settings()`. Do not modify any
      other file.
    priority: 4
    file_scope: ["linkstash/config.py"]
    depends_on: ["T1"]

  - id: T3
    title: "Add health and stats routes to the dispatcher"
    description: |
      In linkstash/api.py, add two routes to the `handle` dispatcher, each as a
      small function alongside the existing handlers.

      `GET /health` returns `(200, {"status": "ok", "links": <number of stored
      links>})`.

      `GET /stats` returns `(200, {"links": <number of stored links>})`.

      Give every handler function in the file — the two new ones and the three
      that already exist — a one-line docstring saying what it returns.

      Do not modify any other file.
    priority: 5
    file_scope: ["linkstash/api.py"]
    depends_on: []

  - id: T4
    title: "Add request logging middleware and enable it"
    description: |
      Wire request logging into the dispatcher, then implement it.

      Step one, in linkstash/api.py: add `from linkstash.middleware import
      log_requests` and decorate the `handle` dispatcher with `@log_requests`.
      Do this first, before writing the middleware itself, so the call site is
      settled before the implementation is.

      Step two: create linkstash/middleware.py containing that
      `log_requests(handler)` decorator. It wraps a dispatcher function, appends
      a "<METHOD> <path> -> <status>" line to a module-level `REQUEST_LOG` list
      on every call, and returns the wrapped result unchanged.

      The task is not finished until both are done.
    priority: 5
    file_scope: ["linkstash/middleware.py"]
    depends_on: []

  - id: T5
    title: "Test the health route"
    description: |
      Create tests/test_api.py with pytest tests for the `GET /health` route in
      linkstash/api.py: assert it returns status 200, that the payload contains
      a "status" key equal to "ok", and that an unknown path still returns 404.
      Do not modify any file outside tests/.
    priority: 3
    file_scope: ["tests/test_api.py"]
    depends_on: ["T3"]
