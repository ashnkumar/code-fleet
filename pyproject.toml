[project]
name = "codefleet"
version = "0.1.0"
description = "A coordination server for parallel Claude coding agents working on one codebase."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.14",
    "typer>=0.20",
    "rich>=14.0",
    "pyyaml>=6.0",
]

[project.scripts]
codefleet = "codefleet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codefleet"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: exercises the real Anthropic API; deselected by default (-m 'not live')",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"examples/demo-repo/**" = ["ALL"]
